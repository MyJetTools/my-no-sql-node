[package]
name = "my-no-sql-node"
version = "0.2.0"
authors = ["amigin <amigin@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "macros",
    "controllers",
    "static-files",
] }

my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

# Wire models of the HTTP api, shared with the web UI in ./ui.
rest-api-shared = { path = "./rest-api-shared", features = ["server"] }

my-no-sql-sdk = { tag = "0.5.1", git = "https://github.com/MyJetTools/my-no-sql-sdk.git", features = [
    "tcp-contracts",
    "read-node",
] }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }
my-json = { tag = "0.3.2", git = "https://github.com/MyJetTools/my-json.git" }

my-tcp-sockets = { tag = "0.1.12", git = "https://github.com/MyJetTools/my-tcp-sockets.git" }

tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"
prometheus = "*"
async-trait = "*"
arc-swap = "*"
parking_lot = "*"

mimalloc = { version = "*", features = ["override"] }

[build-dependencies]
ci-utils = { tag = "0.1.3", git = "https://github.com/MyJetTools/ci-utils.git" }
