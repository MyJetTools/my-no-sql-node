[package]
name = "my-no-sql-node-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
# Kept on the 0.7 line on purpose: dioxus-utils requires `dioxus = "0.7"`, and
# the `dx` CLI that builds this crate has to match the library's minor version.
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# Wire models of the node's HTTP api - the very structs the node serializes.
# Pulled in WITHOUT the "server" feature: the client only builds requests.
rest-api-shared = { path = "../rest-api-shared" }
# HTTP client; compiles to the browser fetch API and resolves relative "/api/..." urls.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }

serde_json = { version = "*" }
serde = { version = "*", features = ["derive"] }

web-sys = { version = "*", features = ["Storage", "Window", "Document", "Element"] }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

[profile.release]
strip = "debuginfo"
